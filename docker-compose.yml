name: invoice-saas
x-backend: &backend
  build: ./backend
  working_dir: /var/www/html
  env_file: ./backend/.env
  environment:
    APP_URL: http://localhost:8000
    FRONTEND_URL: http://localhost:5173
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${MYSQL_DATABASE:-invoices}
    DB_USERNAME: ${MYSQL_USER:-invoices}
    DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    REDIS_HOST: redis
    REDIS_CLIENT: predis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  volumes:
    - ./backend/.env:/var/www/html/.env
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
services:
  backend:
    <<: *backend
  queue:
    <<: *backend
    command: ["sh","-c","until grep -q '^APP_KEY=base64:' .env; do sleep 2; done; php artisan queue:work --tries=3 --timeout=90 --sleep=2"]
  scheduler:
    <<: *backend
    command: ["sh","-c","until grep -q '^APP_KEY=base64:' .env; do sleep 2; done; php artisan schedule:work"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro
    depends_on: [backend]
    restart: unless-stopped
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-invoices}
      MYSQL_USER: ${MYSQL_USER:-invoices}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [nginx]
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
  storage: